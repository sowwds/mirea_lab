worker_processes 1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/jpeg image/png image/svg+xml font/woff font/woff2 audio/mpeg audio/wav audio/ogg;

  # один-единственный upstream
  upstream backend_core_up { server backend_core:8080; }

  # для корректного Upgrade/Connection
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # статика с кэшем
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|mp3|wav|ogg|json|webmanifest)$ {
      try_files $uri =404;
      access_log off;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # service worker/manifest без агрессивного кэша
    location = /registerSW.js { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { try_files $uri =404; add_header Cache-Control "no-cache"; }

    # ВСЕ API -> backend_core, снимаем префикс /api
    location ^~ /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      client_max_body_size 100m;
      proxy_read_timeout 300s;
      proxy_http_version 1.1;

      # ВАЖНО: слэш в конце — удаляет /api из пути
      proxy_pass http://backend_core_up/;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
